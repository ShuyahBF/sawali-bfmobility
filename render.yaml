# Déploiement Render de sawali-bfmobility — serveur FastAPI + site statique (Vite/React).
# Deux services reliés à ce dépôt GitHub : chaque push sur « main » les redéploie.
# Variables « sync: false » : JAMAIS dans Git, saisies une fois par le propriétaire dans le tableau de bord Render.
services:
  - type: web
    name: bfmobility-backend
    runtime: python
    plan: starter
    autoDeploy: true
    rootDir: backend
    # Filtre de build (économie des minutes de compilation Render) : seule une modification utile de
    # backend/ relance une compilation ; les tests et la documentation (.md) n'en déclenchent plus.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    # Domaines du serveur (DNS : CNAME api → bfmobility-backend.onrender.com).
    # 05/11/2026 : NOUVEAU domaine bfmobility.cloud AJOUTÉ à côté de l'ancien (api.sawalismartsysems.com), qui reste en service
    # pendant la transition. Étapes de bascule : docs/BASCULE_DOMAINE.md.
    domains:
      - api.sawalismartsysems.com
      - api.bfmobility.cloud
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      # --- MongoDB Atlas (collections préfixées bfm_) ---
      - key: MONGO_URL
        sync: false
      - key: MONGO_DB_NAME
        value: sawali_bfmobility
      - key: MONGO_COLLECTION_PREFIX
        value: bfm_
      # --- Jeton de connexion ---
      - key: JWT_SECRET
        generateValue: true
      # --- Sites autorisés (CORS) : la PREMIÈRE adresse sert aux liens (retours de paiement, messages) ---
      # Domaine de bfmobility : sawalismartsysems.com (DNS vérifié le 09/10/2026) — adresse principale, en premier.
      # www et l'adresse Render restent autorisés (www renvoie vers le domaine principal).
      # 05/11/2026 : bfmobility.cloud et www.bfmobility.cloud sont AUTORISÉS dès maintenant (CORS), mais restent EN DERNIER :
      # la PREMIÈRE adresse sert aux liens (retours de paiement, messages) et ne doit changer qu'une fois le nouveau domaine
      # validé dans Render (docs/BASCULE_DOMAINE.md, étape « Bascule »).
      - key: FRONTEND_ORIGIN
        value: https://sawalismartsysems.com,https://www.sawalismartsysems.com,https://bfmobility.cloud,https://www.bfmobility.cloud,https://bfmobility-frontend.onrender.com
      # --- Premier administrateur (créé au premier démarrage) ---
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_MOT_DE_PASSE
        sync: false
      - key: ADMIN_TELEPHONE
        sync: false
      # --- Démonstration (catégories, véhicules, chauffeurs, pièces) : 1 = oui ---
      - key: SEED_DEMO
        value: "1"
      - key: DEMO_MOT_DE_PASSE
        sync: false
      # --- Lot 2 : paiement Mobile Money (pawaPay) ---
      # Environnement et jetons pawaPay : groupe d'environnement Render « pawapay-commun »
      # (créé et rempli par le propriétaire, partagé par ZandGo, beAuthentik, adLyn et bfmobility).
      # Ne PAS redéclarer ces 3 variables sur le service : une variable du service masque celle du groupe.
      - fromGroup: pawapay-commun
      - key: PAWAPAY_CALLBACK_SECRET
        sync: false
      # --- Lot 2 : paiement par carte (Stripe) ---
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # --- Lot 2 : WhatsApp (codes de connexion, notifications) : WABA propre OU Transmission SAWALI ---
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_OTP_TEMPLATE
        sync: false
      - key: LILUVINE_WA_URL
        value: https://api.sawalismartsystems.com/api/webhook/liluvine-send
      - key: LILUVINE_WA_HMAC
        sync: false
      - key: LILUVINE_WA_EMETTEUR
        value: bfmobility
      # --- Lot 2 : itinéraires routiers (serveur OSRM public par défaut) ---
      - key: OSRM_URL
        value: https://router.project-osrm.org
      # --- Présence auprès de SAWALI (règle 4) ---
      - key: LOOIS_SUPPORT_CLE
        sync: false

  - type: web
    name: bfmobility-frontend
    runtime: static
    autoDeploy: true
    rootDir: frontend
    # Filtre de build (économie des minutes de compilation Render) : seule une modification utile de
    # frontend/ relance une compilation ; les tests et la documentation (.md) n'en déclenchent plus.
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # Domaine du site : sawalismartsysems.com (A @ → 216.24.57.1) et www (CNAME www → bfmobility-frontend.onrender.com)
    # 05/11/2026 : NOUVEAU domaine bfmobility.cloud AJOUTÉ (mêmes enregistrements DNS : A @ → 216.24.57.1 ; CNAME www et api).
    domains:
      - sawalismartsysems.com
      - www.sawalismartsysems.com
      - bfmobility.cloud
      - www.bfmobility.cloud
    # Application monopage : toutes les adresses renvoient index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Serveur appelé par le site : sous-domaine api du domaine bfmobility (CNAME → bfmobility-backend)
      # Reste sur l'ANCIEN domaine jusqu'à la bascule : api.bfmobility.cloud n'est utilisable qu'une fois son DNS validé dans Render
      # (docs/BASCULE_DOMAINE.md). Valeur après bascule : https://api.bfmobility.cloud
      - key: VITE_API_URL
        value: https://api.sawalismartsysems.com
