# Déploiement Render de sawali-bfmobility — serveur FastAPI + site statique (Vite/React).
# Deux services reliés à ce dépôt GitHub : chaque push sur « main » les redéploie.
# Variables « sync: false » : JAMAIS dans Git, saisies une fois par le propriétaire dans le tableau de bord Render.
services:
  - type: web
    name: bfmobility-backend
    runtime: python
    plan: starter
    autoDeploy: true
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    # Domaine du serveur (sous-domaine de sawalismartsystems.com, DNS chez Cloudflare : CNAME → bfmobility-backend.onrender.com)
    domains:
      - api-bfmobility.sawalismartsystems.com
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      # --- MongoDB Atlas (collections préfixées bfm_) ---
      - key: MONGO_URL
        sync: false
      - key: MONGO_DB_NAME
        value: sawali_bfmobility
      - key: MONGO_COLLECTION_PREFIX
        value: bfm_
      # --- Jeton de connexion ---
      - key: JWT_SECRET
        generateValue: true
      # --- Sites autorisés (CORS) : la PREMIÈRE adresse sert aux liens (retours de paiement, messages) ---
      # Étape 1 (09/10/2026) : domaine bfmobility.sawalismartsystems.com AUTORISÉ, adresse Render encore en premier ;
      # étape 2, une fois le DNS Cloudflare vérifié : le domaine officiel passe en premier.
      - key: FRONTEND_ORIGIN
        value: https://bfmobility-frontend.onrender.com,https://bfmobility.sawalismartsystems.com
      # --- Premier administrateur (créé au premier démarrage) ---
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_MOT_DE_PASSE
        sync: false
      - key: ADMIN_TELEPHONE
        sync: false
      # --- Démonstration (catégories, véhicules, chauffeurs, pièces) : 1 = oui ---
      - key: SEED_DEMO
        value: "1"
      - key: DEMO_MOT_DE_PASSE
        sync: false
      # --- Lot 2 : paiement Mobile Money (pawaPay) ---
      - key: PAWAPAY_ENVIRONMENT
        value: sandbox
      - key: PAWAPAY_API_TOKEN_SANDBOX
        sync: false
      - key: PAWAPAY_API_TOKEN_PRODUCTION
        sync: false
      - key: PAWAPAY_CALLBACK_SECRET
        sync: false
      # --- Lot 2 : paiement par carte (Stripe) ---
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # --- Lot 2 : WhatsApp (codes de connexion, notifications) : WABA propre OU Transmission SAWALI ---
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_OTP_TEMPLATE
        sync: false
      - key: LILUVINE_WA_URL
        value: https://api.sawalismartsystems.com/api/webhook/liluvine-send
      - key: LILUVINE_WA_HMAC
        sync: false
      - key: LILUVINE_WA_EMETTEUR
        value: bfmobility
      # --- Lot 2 : itinéraires routiers (serveur OSRM public par défaut) ---
      - key: OSRM_URL
        value: https://router.project-osrm.org
      # --- Présence auprès de SAWALI (règle 4) ---
      - key: LOOIS_SUPPORT_CLE
        sync: false

  - type: web
    name: bfmobility-frontend
    runtime: static
    autoDeploy: true
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # Domaine du site (sous-domaine de sawalismartsystems.com, DNS chez Cloudflare : CNAME → bfmobility-frontend.onrender.com)
    domains:
      - bfmobility.sawalismartsystems.com
    # Application monopage : toutes les adresses renvoient index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Serveur appelé par le site. Étape 2 (après vérification du DNS) : https://api-bfmobility.sawalismartsystems.com
      - key: VITE_API_URL
        value: https://bfmobility-backend.onrender.com
